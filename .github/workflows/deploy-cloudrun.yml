name: Deploy to Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      service:
        description: Cloud Run service name
        required: false
        default: jeonghwa-app
      region:
        description: GCP region (e.g. asia-northeast3)
        required: false
        default: asia-northeast3
      base_url:
        description: Public base URL for the app
        required: false
        default: https://xn--2i4b17iihloh20d.kr

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      DEFAULT_SERVICE: jeonghwa-app
      DEFAULT_REGION: asia-northeast3
      DEFAULT_BASE_URL: https://xn--2i4b17iihloh20d.kr
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - id: auth
        name: Auth to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker auth (GCR - 원래 방식)
        run: gcloud auth configure-docker gcr.io -q

      - name: Build and push image (GCR 시도 - 원래 방식)
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REGION: ${{ inputs.region || env.DEFAULT_REGION }}
          SERVICE: ${{ inputs.service || env.DEFAULT_SERVICE }}
        id: gcr_push
        continue-on-error: true
        run: |
          COMMIT_SHA=$(git rev-parse --short HEAD)
          IMAGE=gcr.io/${PROJECT_ID}/${SERVICE}:${COMMIT_SHA}
          
          echo "🔨 Building Docker image for GCR (원래 방식)..."
          echo "Image: ${IMAGE}"
          
          docker build -t ${IMAGE} .
          
          echo "📤 Pushing to GCR..."
          if docker push ${IMAGE}; then
            echo "✅ GCR push successful"
            echo "REGISTRY_TYPE=gcr" >> $GITHUB_ENV
            echo "IMAGE=${IMAGE}" >> $GITHUB_ENV
          else
            echo "⚠️  GCR push failed, will try Artifact Registry as fallback"
            echo "REGISTRY_TYPE=artifact" >> $GITHUB_ENV
            exit 1
          fi

      - name: Build and push image (Artifact Registry - 대체 방식)
        if: env.REGISTRY_TYPE == 'artifact'
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REGION: ${{ inputs.region || env.DEFAULT_REGION }}
          SERVICE: ${{ inputs.service || env.DEFAULT_SERVICE }}
        run: |
          REPO_NAME="jeonghwa-docker"
          COMMIT_SHA=$(git rev-parse --short HEAD)
          IMAGE=${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO_NAME}/${SERVICE}:${COMMIT_SHA}
          
          echo "📦 Setting up Artifact Registry..."
          
          # Configure Docker auth for Artifact Registry
          gcloud auth configure-docker ${REGION}-docker.pkg.dev -q
          
          # Create repository if it doesn't exist
          if ! gcloud artifacts repositories describe ${REPO_NAME} \
            --location=${REGION} \
            --project=${PROJECT_ID} 2>/dev/null; then
            echo "Creating Artifact Registry repository..."
            gcloud artifacts repositories create ${REPO_NAME} \
              --repository-format=docker \
              --location=${REGION} \
              --project=${PROJECT_ID} \
              --description="Docker images for Jeonghwa Library" || true
          fi
          
          echo "🔨 Building Docker image for Artifact Registry..."
          docker build -t ${IMAGE} .
          
          echo "📤 Pushing to Artifact Registry..."
          docker push ${IMAGE}
          
          echo "IMAGE=${IMAGE}" >> $GITHUB_ENV

      - name: Deploy to Cloud Run
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REGION: ${{ inputs.region || env.DEFAULT_REGION }}
          SERVICE: ${{ inputs.service || env.DEFAULT_SERVICE }}
          BASE_URL: ${{ inputs.base_url || env.DEFAULT_BASE_URL }}
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
        run: |
          echo "🚀 Deploying to Cloud Run..."
          echo "Image: ${IMAGE}"
          
          gcloud run deploy ${SERVICE} \
            --image=${IMAGE} \
            --project=${PROJECT_ID} \
            --region=${REGION} \
            --platform=managed \
            --allow-unauthenticated \
            --set-env-vars=BASE_URL=${BASE_URL},RAILS_MASTER_KEY=${RAILS_MASTER_KEY}

      - name: Run database migrations
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REGION: ${{ inputs.region || env.DEFAULT_REGION }}
          SERVICE: ${{ inputs.service || env.DEFAULT_SERVICE }}
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
        run: |
          echo "Running database migrations..."
          gcloud run jobs create migrate-${SERVICE} \
            --image=${IMAGE} \
            --region=${REGION} \
            --project=${PROJECT_ID} \
            --command=bash \
            --args=-c,"bundle exec rails db:migrate" \
            --set-env-vars=RAILS_ENV=production,RAILS_MASTER_KEY=${RAILS_MASTER_KEY} \
            --max-retries=1 \
            --task-timeout=600s || echo "Migration job may already exist, attempting to execute..."
          gcloud run jobs execute migrate-${SERVICE} \
            --region=${REGION} \
            --project=${PROJECT_ID} \
            --wait || echo "Migration job execution completed or failed"

      - name: Health Check (Domain)
        env:
          BASE_URL: ${{ inputs.base_url || env.DEFAULT_BASE_URL }}
        run: |
          echo "Checking health of ${BASE_URL}..."
          for i in {1..10}; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -L ${BASE_URL}/up || echo "000")
            echo "Attempt $i: HTTP $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "302" ]; then
              echo "✅ Health check passed (HTTP $HTTP_CODE)"
              exit 0
            fi
            echo "⏳ Waiting 10s before retry..."
            sleep 10
          done
          echo "❌ Health check failed after 10 attempts"
          exit 1


