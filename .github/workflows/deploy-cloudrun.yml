name: Deploy to Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      service:
        description: Cloud Run service name
        required: false
        default: jeonghwa-app
      region:
        description: GCP region (e.g. asia-northeast3)
        required: false
        default: asia-northeast3
      base_url:
        description: Public base URL for the app
        required: false
        default: https://xn--2i4b17iihloh20d.kr

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      DEFAULT_SERVICE: jeonghwa-app
      DEFAULT_REGION: asia-northeast3
      DEFAULT_BASE_URL: https://xn--2i4b17iihloh20d.kr
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - id: auth
        name: Auth to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify GCP setup and permissions
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REGION: ${{ inputs.region || env.DEFAULT_REGION }}
        run: |
          echo "🔍 Verifying GCP setup..."
          echo "Project ID: ${PROJECT_ID}"
          echo "Region: ${REGION}"
          
          # Check if project is accessible
          if ! gcloud projects describe ${PROJECT_ID} > /dev/null 2>&1; then
            echo "❌ Error: Cannot access project ${PROJECT_ID}"
            exit 1
          fi
          
          # Check if Artifact Registry API is enabled
          echo "Checking Artifact Registry API..."
          if ! gcloud services list --enabled --project=${PROJECT_ID} --filter="name:artifactregistry.googleapis.com" --format="value(name)" | grep -q "artifactregistry.googleapis.com"; then
            echo "⚠️  Warning: Artifact Registry API may not be enabled"
            echo "Please enable it: gcloud services enable artifactregistry.googleapis.com --project=${PROJECT_ID}"
          else
            echo "✅ Artifact Registry API is enabled"
          fi
          
          # Check permissions
          echo "Checking service account permissions..."
          SERVICE_ACCOUNT=$(gcloud config get-value account)
          echo "Current account: ${SERVICE_ACCOUNT}"

      - name: Create Artifact Registry repository (if not exists)
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REGION: ${{ inputs.region || env.DEFAULT_REGION }}
          SERVICE: ${{ inputs.service || env.DEFAULT_SERVICE }}
        run: |
          REPO_NAME="jeonghwa-docker"
          echo "📦 Checking Artifact Registry repository: ${REPO_NAME}"
          
          # Check if repository exists, create if not
          if gcloud artifacts repositories describe ${REPO_NAME} \
            --location=${REGION} \
            --project=${PROJECT_ID} 2>/dev/null; then
            echo "✅ Repository ${REPO_NAME} already exists"
          else
            echo "Creating Artifact Registry repository: ${REPO_NAME}"
            if gcloud artifacts repositories create ${REPO_NAME} \
              --repository-format=docker \
              --location=${REGION} \
              --project=${PROJECT_ID} \
              --description="Docker images for Jeonghwa Library"; then
              echo "✅ Repository created successfully"
            else
              echo "❌ Failed to create repository. This may indicate permission issues."
              echo "Required role: roles/artifactregistry.admin or roles/artifactregistry.writer"
              echo "Please ensure the service account has proper permissions."
              exit 1
            fi
          fi

      - name: Configure Docker auth (Artifact Registry)
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REGION: ${{ inputs.region || env.DEFAULT_REGION }}
        run: |
          gcloud auth configure-docker ${REGION}-docker.pkg.dev -q

      - name: Build and push image (Artifact Registry)
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REGION: ${{ inputs.region || env.DEFAULT_REGION }}
          SERVICE: ${{ inputs.service || env.DEFAULT_SERVICE }}
        run: |
          REPO_NAME="jeonghwa-docker"
          COMMIT_SHA=$(git rev-parse --short HEAD)
          IMAGE=${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO_NAME}/${SERVICE}:${COMMIT_SHA}
          
          echo "🔨 Building Docker image..."
          echo "Image: ${IMAGE}"
          
          if docker build -t ${IMAGE} .; then
            echo "✅ Docker build successful"
          else
            echo "❌ Docker build failed"
            exit 1
          fi
          
          echo "📤 Pushing image to Artifact Registry..."
          if docker push ${IMAGE}; then
            echo "✅ Image pushed successfully"
            echo "IMAGE=${IMAGE}" >> $GITHUB_ENV
          else
            echo "❌ Failed to push image. This may indicate permission issues."
            echo "Required role: roles/artifactregistry.writer"
            echo "Please ensure the service account has proper permissions."
            exit 1
          fi

      - name: Deploy to Cloud Run
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REGION: ${{ inputs.region || env.DEFAULT_REGION }}
          SERVICE: ${{ inputs.service || env.DEFAULT_SERVICE }}
          BASE_URL: ${{ inputs.base_url || env.DEFAULT_BASE_URL }}
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
        run: |
          REPO_NAME="jeonghwa-docker"
          IMAGE=${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO_NAME}/${SERVICE}:$(git rev-parse --short HEAD)
          gcloud run deploy ${SERVICE} \
            --image=${IMAGE} \
            --project=${PROJECT_ID} \
            --region=${REGION} \
            --platform=managed \
            --allow-unauthenticated \
            --set-env-vars=BASE_URL=${BASE_URL},RAILS_MASTER_KEY=${RAILS_MASTER_KEY}

      - name: Run database migrations
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REGION: ${{ inputs.region || env.DEFAULT_REGION }}
          SERVICE: ${{ inputs.service || env.DEFAULT_SERVICE }}
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
        run: |
          REPO_NAME="jeonghwa-docker"
          IMAGE=${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO_NAME}/${SERVICE}:$(git rev-parse --short HEAD)
          echo "Running database migrations..."
          gcloud run jobs create migrate-${SERVICE} \
            --image=${IMAGE} \
            --region=${REGION} \
            --project=${PROJECT_ID} \
            --command=bash \
            --args=-c,"bundle exec rails db:migrate" \
            --set-env-vars=RAILS_ENV=production,RAILS_MASTER_KEY=${RAILS_MASTER_KEY} \
            --max-retries=1 \
            --task-timeout=600s || echo "Migration job may already exist, attempting to execute..."
          gcloud run jobs execute migrate-${SERVICE} \
            --region=${REGION} \
            --project=${PROJECT_ID} \
            --wait || echo "Migration job execution completed or failed"

      - name: Health Check (Domain)
        env:
          BASE_URL: ${{ inputs.base_url || env.DEFAULT_BASE_URL }}
        run: |
          echo "Checking health of ${BASE_URL}..."
          for i in {1..10}; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -L ${BASE_URL}/up || echo "000")
            echo "Attempt $i: HTTP $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "302" ]; then
              echo "✅ Health check passed (HTTP $HTTP_CODE)"
              exit 0
            fi
            echo "⏳ Waiting 10s before retry..."
            sleep 10
          done
          echo "❌ Health check failed after 10 attempts"
          exit 1


