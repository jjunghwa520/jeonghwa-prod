name: Deploy to Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      service:
        description: Cloud Run service name
        required: false
        default: jeonghwa-app
      region:
        description: GCP region (e.g. asia-northeast3)
        required: false
        default: asia-northeast3
      base_url:
        description: Public base URL for the app
        required: false
        default: https://xn--2i4b17iihloh20d.kr

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      DEFAULT_SERVICE: jeonghwa-app
      DEFAULT_REGION: asia-northeast3
      DEFAULT_BASE_URL: https://xn--2i4b17iihloh20d.kr
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Validate Secrets
        run: |
          echo "🔍 Validating required secrets..."
          if [ -z "${{ secrets.GCP_PROJECT_ID }}" ]; then
            echo "❌ Error: GCP_PROJECT_ID secret is empty!"
            exit 1
          fi
          if [ -z "${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}" ]; then
            echo "❌ Error: GCP_WORKLOAD_IDENTITY_PROVIDER secret is empty!"
            exit 1
          fi
          if [ -z "${{ secrets.GCP_SERVICE_ACCOUNT }}" ]; then
            echo "❌ Error: GCP_SERVICE_ACCOUNT secret is empty!"
            exit 1
          fi
          if [ -z "${{ secrets.RAILS_MASTER_KEY }}" ]; then
            echo "❌ Error: RAILS_MASTER_KEY secret is empty!"
            exit 1
          fi
          echo "✅ All required secrets are present"
          echo "PROJECT_ID length: $(echo -n '${{ secrets.GCP_PROJECT_ID }}' | wc -c)"

      - id: auth
        name: Auth to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify GCP Access
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          echo "🔍 Verifying GCP access..."
          gcloud config set project ${PROJECT_ID}
          gcloud projects describe ${PROJECT_ID} || {
            echo "❌ Error: Cannot access GCP project ${PROJECT_ID}"
            exit 1
          }
          echo "✅ GCP access verified"

      - name: Configure Docker auth (gcr.io)
        run: |
          echo "🔧 Configuring Docker for GCR..."
          gcloud auth configure-docker gcr.io -q
          echo "✅ Docker configured"

      - name: Ensure GCR repository exists
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          SERVICE: ${{ inputs.service || env.DEFAULT_SERVICE }}
        run: |
          echo "🔍 Checking GCR repository..."
          if ! gcloud container images describe gcr.io/${PROJECT_ID}/${SERVICE}:latest 2>/dev/null; then
            echo "📦 GCR repository doesn't exist, but it will be created on first push"
            echo "💡 Note: Service account needs 'Storage Admin' or 'Artifact Registry Writer' role"
          else
            echo "✅ GCR repository exists"
          fi

      - name: Build and push image (gcr.io)
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REGION: ${{ inputs.region || env.DEFAULT_REGION }}
          SERVICE: ${{ inputs.service || env.DEFAULT_SERVICE }}
        run: |
          set -e  # Exit on error
          COMMIT_SHA=$(git rev-parse --short HEAD)
          
          # Debug: Print variables (masked)
          echo "🔍 Build Configuration:"
          echo "PROJECT_ID: ${PROJECT_ID:0:4}**** (length: ${#PROJECT_ID})"
          echo "REGION: ${REGION}"
          echo "SERVICE: ${SERVICE}"
          echo "COMMIT_SHA: ${COMMIT_SHA}"
          
          # Validate PROJECT_ID
          if [ -z "${PROJECT_ID}" ]; then
            echo "❌ Error: GCP_PROJECT_ID is empty!"
            exit 1
          fi
          
          IMAGE=gcr.io/${PROJECT_ID}/${SERVICE}:${COMMIT_SHA}
          echo "📦 Target Image: ${IMAGE}"
          
          # Check if Dockerfile exists
          if [ ! -f "Dockerfile" ]; then
            echo "❌ Error: Dockerfile not found in repository root"
            exit 1
          fi
          
          echo "🔨 Building Docker image..."
          docker build \
            --progress=plain \
            --tag ${IMAGE} \
            . 2>&1 | tee /tmp/docker-build.log || {
            echo "❌ Docker build failed"
            echo "Last 50 lines of build log:"
            tail -50 /tmp/docker-build.log
            exit 1
          }
          
          echo "📤 Pushing to GCR..."
          docker push ${IMAGE} || {
            echo "❌ Docker push failed"
            echo "💡 Troubleshooting:"
            echo "1. Check GCR permissions: gcloud projects get-iam-policy ${PROJECT_ID}"
            echo "2. Verify service account has 'Storage Admin' or 'Artifact Registry Writer' role"
            echo "3. Check if GCR API is enabled: gcloud services list --enabled"
            exit 1
          }
          
          echo "✅ Build and push successful: ${IMAGE}"

      - name: Deploy to Cloud Run (gcr.io)
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REGION: ${{ inputs.region || env.DEFAULT_REGION }}
          SERVICE: ${{ inputs.service || env.DEFAULT_SERVICE }}
          BASE_URL: ${{ inputs.base_url || env.DEFAULT_BASE_URL }}
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
        run: |
          IMAGE=gcr.io/${PROJECT_ID}/${SERVICE}:$(git rev-parse --short HEAD)
          gcloud run deploy ${SERVICE} \
            --image=${IMAGE} \
            --project=${PROJECT_ID} \
            --region=${REGION} \
            --platform=managed \
            --allow-unauthenticated \
            --set-env-vars=BASE_URL=${BASE_URL},RAILS_MASTER_KEY=${RAILS_MASTER_KEY}

      - name: Run database migrations
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REGION: ${{ inputs.region || env.DEFAULT_REGION }}
          SERVICE: ${{ inputs.service || env.DEFAULT_SERVICE }}
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
        run: |
          IMAGE=gcr.io/${PROJECT_ID}/${SERVICE}:$(git rev-parse --short HEAD)
          echo "Running database migrations..."
          gcloud run jobs create migrate-${SERVICE} \
            --image=${IMAGE} \
            --region=${REGION} \
            --project=${PROJECT_ID} \
            --command=bash \
            --args=-c,"bundle exec rails db:migrate" \
            --set-env-vars=RAILS_ENV=production,RAILS_MASTER_KEY=${RAILS_MASTER_KEY} \
            --max-retries=1 \
            --task-timeout=600s || echo "Migration job may already exist, attempting to execute..."
          gcloud run jobs execute migrate-${SERVICE} \
            --region=${REGION} \
            --project=${PROJECT_ID} \
            --wait || echo "Migration job execution completed or failed"

      - name: Health Check (Domain)
        env:
          BASE_URL: ${{ inputs.base_url || env.DEFAULT_BASE_URL }}
        run: |
          echo "Checking health of ${BASE_URL}..."
          for i in {1..10}; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -L ${BASE_URL}/up || echo "000")
            echo "Attempt $i: HTTP $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "302" ]; then
              echo "✅ Health check passed (HTTP $HTTP_CODE)"
              exit 0
            fi
            echo "⏳ Waiting 10s before retry..."
            sleep 10
          done
          echo "❌ Health check failed after 10 attempts"
          exit 1


